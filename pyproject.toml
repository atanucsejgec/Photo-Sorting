[project]
name = "photo-sorter"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6-Essentials>=6.8",
    "Pillow>=11",
    "pillow-heif>=0.20",
    "hachoir>=3.3",
    "platformdirs>=4",
    "numpy>=2.5.4",
    "imagehash>=4.3.2",
    "onnxruntime-gpu==1.31.0",
    "reverse-geocode==1.6.6",
    "tokenizers>=0.23.3",
]

[project.scripts]
photo-sorter = "photosort.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4"]
# The CUDA and cuDNN libraries (~2 GB). The launcher leaves them out on
# computers without an NVIDIA GPU.
gpu = ["onnxruntime-gpu[cuda,cudnn]==1.31.0"]

[tool.uv]
default-groups = ["dev", "gpu"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photosort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
